# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# One step, two halves, and the split between them is the whole point:
#
#   1. build the landing SPA (src/main/webui = the qits-spa-home submodule) HERE, in the step
#      container, which sits on qits-net and can therefore reach the platform's own npm registry —
#      where @qits/angular and @qits/ui-components live and where nothing else can reach them from;
#   2. build this repo's docker/Dockerfile, whose builder stage packages that already-built bundle
#      and never runs an install.
#
# A RUN step inside a docker build reaches the public internet but reaches the platform registry by
# no address at all (not the qits-net alias, not localhost:8081, not host.docker.internal). That is
# why the halves are split, and it is why this step's image is node-docker-base rather than ci-base:
# it needs node, npm and git for half one and the docker CLI for half two.
#
# Publish it under the tag that is the whole contract with qits-deployments —
# <registry>/<repository>/<this repo's name>:<sha>. The step's own container only drives the docker
# CLI; the build and the push happen in the host's daemon through the socket this step declares
# (docker: true). A failed push is a failed step is a FAILED run.
#
# QITS_VARIANT=local: this pipeline publishes the UNAUTHENTICATED gateway, on purpose — the
# platform this flow feeds is a workstation's own, its registry local, its port loopback-bound,
# and every request already arrives as the one trusted user. A deployment that fronts anything
# beyond one machine builds the oauth variant instead and must not consume this image.
steps:
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this an early failure would be
      # swallowed by the next command's exit code. -u is load-bearing too: an unset registry var
      # must stop the step, not quietly resolve the @qits scope against npmjs.org, where these
      # packages do not exist and never will.
      set -eu

      # The daemon's clone does not recurse, so the gitlink at src/main/webui is an empty directory
      # — which Quinoa treats as a misconfiguration rather than "no client", and the image build
      # would stop at "No package.json found in Web UI directory". A public GitHub repo, one fetch,
      # no credentials — the same shape every webui-carrying sibling uses.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-spa-home"
      git -c submodule.qits-spa-home.url="$frontend_url" submodule update --init src/main/webui

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative. Same problem
      # and same fix as qits-spa-home's own pipeline — that repo's recipe is where this pattern is
      # maintained, and the two should keep matching.
      #
      # npm pins a full resolved URL per package, and qits-spa-home's lockfile is generated on the
      # deployment host, so every entry names a localhost port — an address that does not exist in
      # this container. `npm ci` fetches tarballs by that URL and never asks the configured registry
      # for them, so the environment below does not reach them: without this swap the install dies
      # on connection refused. The paths are identical on every address, so replacing the ORIGIN and
      # keeping the path is all it takes, and the integrity hashes are what make that safe — bytes
      # from the other address must still hash the same. The checkout is this step's own; nothing is
      # edited that anyone will ever read again.
      #
      # THE BYTE PLANE IS TWO SERVICES SINCE THE SPLIT, WHICH IS WHY THE SWAP READS THE PATH.
      # qits-platform-mirror holds the npmjs pull-through cache; qits-artifacts hosts the @qits
      # scope. No single origin serves both, so the path is what tells them apart: an entry under
      # the hosted registry's own pathname — $QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/ — is a
      # @qits tarball and gets the hosted origin, and every other entry gets the proxy's. One sed
      # covered both roots while they shared an origin; since the split it sends every @qits tarball
      # to the mirror, which has never held one: 404, on every run.
      #
      # THE ORDER OF THE TWO EXPRESSIONS IS THE WHOLE TRICK. sed applies -e in sequence per line, so
      # the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits entries
      # after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path, and could not have told two registries apart either.
      # @npmcli/arborist glues rather than resolves (reify.js:
      # `registry.slice(0, -1) + resolvedURL.pathname`), so
      # http://qits-platform-mirror:8080/artifacts/npm/npmjs/ + /artifacts/npm/npmjs/zone.js/-/…tgz
      # comes out as …/artifacts/npm/npmjs/artifacts/npm/npmjs/zone.js/-/…tgz and every tarball
      # 404s. Measured on npm 10.9.4.
      #
      # Every address is derived from the injected env rather than spelled here: no repository
      # states a deployment's addresses, and the two qits-spa-home does state (localhost:8081 for
      # the @qits scope and localhost:8082 for npmjs, in its .npmrc, for a developer on the host)
      # are the ones being replaced.
      cd src/main/webui
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. qits-spa-home COMMITS an .npmrc (localhost:8081 for @qits and
      # localhost:8082 for npmjs, right for a developer on the host), and npm ranks a project .npmrc
      # ABOVE ~/.npmrc — so a `cat > ~/.npmrc` preamble would be written and silently ignored.
      # `npm_config_*` environment outranks both files, so it wins without touching the submodule's
      # tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      # dist/qits-spa-home/browser — the bundle the image build consumes, and the ONE artifact this
      # half exists to produce. Lint and test are qits-spa-home's own pipeline's job; repeating them
      # here would only make this repo red for someone else's commit.
      npm run build
      cd -

      # BUILDKIT, ENGAGED EXPLICITLY, and the plugin has to be installed before it can be. Measured
      # in THIS image — node-docker-base is node:24-alpine plus `apk add docker-cli`, CLI 29.5.3 —
      # against this host's daemon:
      #
      #   docker build       "DEPRECATED: The legacy builder is deprecated ...", then builds anyway
      #   DOCKER_BUILDKIT=1  "ERROR: BuildKit is enabled but the buildx component is missing"
      #
      # The builder is chosen by the CLIENT, and the apk docker-cli carries no buildx plugin, so
      # every image this repository ever published came off the LEGACY builder without saying so.
      #
      # THAT IS WHAT BROKE THE RELEASE OF 2026-08-11, and it is a property of this host rather than
      # bad luck. The legacy builder keeps its cache as untagged intermediate images; this host's
      # dockerd runs the containerd image store, whose GC collects an image nothing references. Two
      # builds of this one Dockerfile run CONCURRENTLY on it — this pipeline on main and the same
      # pipeline on environment/dev — and they share the whole early cache chain, so one cache-hit
      # an intermediate and seconds later died on "failed to export image: No such image".
      # Buildkit's cache lives in buildkit's own store, held by the build that is using it, and has
      # no such window.
      #
      # The guard retires itself: the day node-docker-base ships docker-cli-buildx the apk line is a
      # no-op and nothing here changes. `DOCKER_BUILDKIT=1` is what makes a missing plugin a hard
      # error instead of a silent fall back to the builder this prelude exists to leave.
      #
      # BUILDX_NO_DEFAULT_ATTESTATIONS=1 keeps the PUSHED shape byte-for-byte what it is today. Left
      # on, buildx wraps the image in a manifest list and adds a provenance attestation manifest —
      # and this is the first buildkit-built image on this platform, so qits-artifacts and
      # qits-deployments have only ever been handed a single manifest. This change is about which
      # builder runs, not about what lands in the registry.
      docker buildx version >/dev/null 2>&1 || apk add --no-cache docker-cli-buildx
      export DOCKER_BUILDKIT=1 BUILDX_NO_DEFAULT_ATTESTATIONS=1

      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-gateway:$QITS_CI_SHA"
      docker build -t "$ref" -f docker/Dockerfile --build-arg QITS_VARIANT=local .
      docker push "$ref"
      # NO `docker rmi "$ref"` any more: it freed nothing a CI host wants back — the layers stay in
      # buildkit's cache either way — while under the containerd image store it drops the last
      # reference to content a concurrent build of this same Dockerfile may still be resolving,
      # which is the race this whole change undoes.

  - image: qits/build-images/node-base:latest
    branches:
      - prefix: maintenance/
    timeout-seconds: 300
    script: |
      set -eu
      case "$QITS_CI_BRANCH" in
        maintenance/*) ;;
        *) echo "not a maintenance branch: $QITS_CI_BRANCH"; exit 1 ;;
      esac
      summary=$(git log -1 --format=%s)
      node -e '
        const [url, branch, summary] = process.argv.slice(1);
        fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ branch, summary }),
        }).then(async (res) => {
          const text = await res.text();
          let body = {};
          try { body = JSON.parse(text); } catch {}
          if (res.ok) {
            console.log(`released ${body.version} as ${body.commitSha} from ${body.branch}`);
            return;
          }
          if (res.status === 409 && body.reason === "ALREADY_INTEGRATED") {
            console.log(`${branch} is already released - nothing to do`);
            return;
          }
          console.error(`release refused: HTTP ${res.status} ${text}`);
          process.exit(1);
        }).catch((err) => {
          console.error(`release call failed: ${err.message}`);
          process.exit(1);
        });
      ' "$QITS_WORKSPACES_URL/workspaces/api/branches/release?repositoryId=$QITS_CI_REPO_ID" \
        "$QITS_CI_BRANCH" "$summary"
