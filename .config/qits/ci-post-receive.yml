# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# One step: build this repo's docker/Dockerfile and publish it under the tag that is the whole
# contract with qits-cd — <registry>/<repository>/<this repo's name>:<sha>. The step's own
# container only drives the docker CLI; the build and the push happen in the host's daemon
# through the socket this step declares (docker: true). A failed push is a failed step is a
# FAILED run.
#
# QITS_VARIANT=oauth: a published gateway image is the shipped form and has to have said out
# loud that it authenticates. The `local` variant is EXPLICITLY UNAUTHENTICATED and exists only
# as a workstation's own hand-built image — publishing one would be the regression.
steps:
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-gateway:$QITS_CI_SHA"
      docker build -t "$ref" -f docker/Dockerfile --build-arg QITS_VARIANT=oauth .
      docker push "$ref"
      docker rmi "$ref" || true
