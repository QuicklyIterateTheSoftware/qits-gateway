# How qits-platform-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# ENVIRONMENT service: every environment runs its own gateway. The platform edge fronts them
# all and owns the host port, so a gateway no longer binds one itself. Today prod is the only
# environment, so it deploys from prod's branch.
deployment_target: environment
deploy_branches: environment/prod

# The gateway owns the root path space, so the convention /gateway/q/health/ready would 404.
health_path: /q/health/ready
