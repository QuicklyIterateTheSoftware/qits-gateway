# Test config. Clear the shipped catch-all (app-host=qits) so there is NO catch-all: the suite's own
# service routes (injected by StubUpstream at an ephemeral port) are the whole table — which also
# lets a test assert that an unrouted path 404s instead of being swallowed by a catch-all.
qits.gateway.app-host=

# --- the IdP the suite is challenged towards -----------------------------------------------------
# NO DOCKER AND NO NETWORK. `./mvnw test` must run from a clone of this repo alone, so: Keycloak Dev
# Services is off (it would pull and start a real container per test class the moment quarkus-oidc
# appeared on the classpath), discovery is off (nothing to fetch), and early JWKS resolution is off
# (the one remaining thing that would dial out).
#
# The host below is deliberately unreachable and never contacted. Nothing here completes a code
# flow — what the suite asserts is that the gateway *challenges* and where it sends you, which is
# built entirely from the static config beneath. Exchanging a code is quarkus-oidc's job and
# quarkus-oidc's tests.
#
# This is static config rather than a WireMock test resource on purpose: resource-injected config
# does not survive the Quarkus restarts that @TestProfile and class-level @TestSecurity force, and
# a suite where three classes silently skip every test is worse than no suite.
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.auth-server-url=http://localhost:1/realms/qits
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks.resolve-early=false
quarkus.oidc.authorization-path=/protocol/openid-connect/auth
quarkus.oidc.token-path=/protocol/openid-connect/token
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
# Required because the shipped config sets quarkus.oidc.logout.path: with discovery off there is no
# document to advertise an end_session_endpoint, and RP-initiated logout refuses to start without
# one. Spelling it out keeps the shipped logout path inside the tested configuration rather than
# quietly dropping it.
quarkus.oidc.end-session-path=/protocol/openid-connect/logout
quarkus.oidc.client-id=qits-gateway-test
# 32+ characters: shorter secrets make quarkus-oidc warn about weak session-cookie encryption.
quarkus.oidc.credentials.secret=test-secret-at-least-32-characters-long

quarkus.log.category."eu.wohlben.qits.gateway".level=DEBUG
