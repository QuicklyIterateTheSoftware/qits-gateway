# Test config. The shipped default route (`/` -> qits:8080) is disabled so the suite's own routes
# (injected by StubUpstream at an ephemeral port) are the whole table — which also lets a test
# assert that an unrouted path 404s instead of being swallowed by a catch-all.
qits.gateway.routes.qits.enabled=false

quarkus.log.category."eu.wohlben.qits.gateway".level=DEBUG
