# qits-gateway — the qits front door (docs/epics/qits-gateway/epic.md in the qits monorepo).
# A stateless reverse proxy: it holds a route table and streams bytes. No datasource, no ORM, no
# REST layer — see README.md for the routing model.

# The single published listener of a qits deployment. Bind on all interfaces: the process runs in a
# container and is reached from outside it.
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Bodies stream through the proxy, but the server still enforces this ceiling on the way in — and it
# does so AHEAD of everything this process registers: Quarkus installs the check as a Vert.x route at
# order -2, while GatewayRouter's catch-all sits at Integer.MAX_VALUE-1000. A body this rejects never
# reaches a route table, let alone an upstream.
#
# It has to be at least as large as the biggest upload any fronted component accepts. That used to be
# an artifact blob; it is now an OCI image layer, which `docker push` sends as ONE request body.
# 1088M is qits-artifacts' own ceiling — one number spelled in two repositories. Raise the layer cap
# there without raising this and every large layer 413s at the front door, before the registry can
# answer with the Distribution spec's JSON error envelope.
#
# The two rejections are distinguishable, which is the fastest way to tell which ceiling you hit: the
# gateway's 413 has an EMPTY body, the registry's carries {"errors":[…]}.
#
# What this does NOT do, and what the previous wording implied it did: bound a CHUNKED request.
# Quarkus' check compares the Content-Length header and, when there is none, only stashes the limit
# for a body READER to enforce — and this process reads no bodies at all. A `Transfer-Encoding:
# chunked` upload is unbounded here whatever this says. The byte cap that actually holds is the one
# the receiving service enforces while streaming (qits.artifacts.oci.max-layer-size, and the
# per-RepositoryType caps before it). There is no per-path variant of this setting in Quarkus, so
# there is no way to give the non-/v2 prefixes a lower one from configuration; an operator who needs
# that terminates TLS in front of the gateway at something that has per-location limits.
quarkus.http.limits.max-body-size=1088M

# Long-lived exchanges pass through here: SSE event channels, `git clone` of a big repository, and
# dev-server HMR websockets. The default 60s read timeout would sever them.
quarkus.http.idle-timeout=1H

# The gateway's own surface, never proxied (GatewayRouter skips this prefix explicitly):
#   /q/health/live   — the process is up
#   /q/health/ready  — a non-empty route table, with the table itself as health data
# This is the GATEWAY's /q, not a service's. Each service now serves its own under its segment
# (/observability/q/openapi and so on), which the gateway proxies like any other path — and which is
# NOT on the token-free allowlist, because nothing that must reach it comes through here.
quarkus.http.non-application-root-path=/q

# --- the web components' identity relay ----------------------------------------------------------
# GET /api/config.json is served by this process (ConfigJsonRoute), not proxied: it is web-component
# configuration, and the gateway is what serves the web components. The path is fixed by its caller
# — @qits/angular fetches the base-relative `api/config.json` before the app bootstraps — and takes
# no segment prefix, because the gateway has none.
#
# The values are injected by the deployment, under the same names a supervising qits already uses,
# and relayed verbatim; nothing is defaulted here. Absent OTEL endpoint ⇒ SPA telemetry stays dark;
# absent capture endpoint ⇒ no capture button. The two gate independently.
#   OTEL_EXPORTER_OTLP_ENDPOINT   gate for the `telemetry` section (the URL itself is not relayed)
#   OTEL_SERVICE_NAME             relayed as telemetry.serviceName (defaults to `webapp`)
#   OTEL_RESOURCE_ATTRIBUTES      the k=v,k=v list, parsed into both sections' resourceAttributes
#   QITS_CAPTURE_ENDPOINT         relayed verbatim as capture.ingestUrl

# --- the platform's left navigation --------------------------------------------------------------
# GET /main-navigation is served by this process too (NavigationRoute) and has NO key here, which is
# the point: it is derived from the route table below, so a service appears in the menu exactly when
# this gateway routes it. @qits/ui-components used to carry the same list hardcoded in a published
# npm package, where it could only ever be a copy — and it was a stale one.

# --- the routed services (the QitsService registry) ----------------------------------------------
# A service is routed only when its host is named here; the entry is both the on-switch and the
# target. The key is the public segment — the qits- prefix is NOT exposed, so qits-platform-artifacts
# is reached at /artifacts/*. The value is `host` or `host:port` (default port 8080). Forwarding is
# verbatim: the upstream sees /artifacts/… unchanged, which is why the same address works for a
# service-to-service call on the internal network that never passes through here.
#   QITS_GATEWAY_PROXY_HOSTS_ARTIFACTS=qits-platform-artifacts
#
# THE HOST IS NOT DERIVABLE FROM THE SEGMENT, which is why nothing here derives one. A platform
# service answers to its own name (qits-platform-artifacts); an application of an environment
# answers to <env>-qits-<app>, and this image does not know which environment it was deployed into.
# Only the deployment does, so only the deployment names hosts.
#
# Listed below but NOT enabled here, and that is deliberate rather than leftover. A Map entry cannot
# be UNSET by a later config source, only overridden — so an entry shipped here is an entry no
# deployment and no test can take away. The suite depends on that (StubUpstream enables artifacts
# and observability, and GatewayRoutingTest asserts an unconfigured `stt` is not routed), and a
# deployment that runs five of six would have no way to say so.
#
# So the route table is named by the deployment, in full — here as prod would spell it:
#   env applications         QITS_GATEWAY_PROXY_HOSTS_CI=prod-qits-ci
#   platform services        QITS_GATEWAY_PROXY_HOSTS_ARTIFACTS=qits-platform-artifacts
#   one host, many ports     QITS_GATEWAY_PROXY_HOSTS_PROJECTS=localhost:8090
# qits.gateway.proxy-hosts.artifacts=qits-platform-artifacts
# qits.gateway.proxy-hosts.docs=prod-qits-docs
# qits.gateway.proxy-hosts.platform-deployments=prod-qits-deployments
# qits.gateway.proxy-hosts.observability=prod-qits-observability
# qits.gateway.proxy-hosts.workspaces=prod-qits-workspaces
# qits.gateway.proxy-hosts.projects=prod-qits-projects
# qits.gateway.proxy-hosts.stt=prod-qits-stt
# qits.gateway.proxy-hosts.events=prod-qits-events
# qits.gateway.proxy-hosts.ci=prod-qits-ci
# qits.gateway.proxy-hosts.git=prod-qits-githost
#
# Note the last one: the SEGMENT is `git` while the repository is qits-githost, because the segment
# has to be what the service serves and qits-githost serves /git. The key follows the segment, so
# the env spelling is QITS_GATEWAY_PROXY_HOSTS_GIT.
#
# A multi-word segment is DASHED, and the env spelling QITS_GATEWAY_PROXY_HOSTS_PLATFORM_DEPLOYMENTS
# reaches the route table only because RouteTable looks every known service up BY NAME — config
# mapping discovery cannot split a multi-word map key out of an all-underscore env var name. See
# RouteTable.resolveProxyHosts.

# --- there is still no catch-all UPSTREAM --------------------------------------------------------
# No proxy route claims "everything else". A path no service above claims names no upstream, the
# gateway opens no connection for it, and RouteTable.match answers empty.
#
# It used to fall through to the qits monolith at qits.gateway.app-host, so that the split could run
# beside the monolith and hand paths over one at a time. That is not how this ships: qits is
# deployed CLEAN on a new environment — these services and nothing else, with no monolith running
# beside them and no shared database, volume or session between the two. There is no upstream that
# serves "everything else", so configuring one would only mean forwarding unrouted traffic to
# something that cannot answer it.
#
# What HAS changed: an unclaimed path is no longer a 404 you read in a terminal — it is the landing
# SPA below, served by this process out of its own binary. That is static serving, not proxying: no
# host is selected, no socket is opened, and the route table is untouched by it. GatewayRouter does
# not answer such a path at all; it calls next() and lets the SPA fallback behind it answer.
#
# Note what CANNOT be configured here, because it is the shape this file used to have: a route
# claiming `/`. GatewayRoute rejects an empty prefix outright rather than normalising it into a
# catch-all, and proxy-hosts keys are QitsService segments — so there is no key, and no value, that
# would put an upstream in front of the landing page. The single-upstream topology is gone from the
# configuration surface, not merely unused by it.
#
# The consequence to know is unchanged: an unconfigured gateway routes nothing and reports NOT READY
# (RouteTableHealthCheck — "this gateway can route something"). That matters MORE now, not less: a
# missing proxy-hosts entry does not become a 502 from a default upstream and no longer becomes a
# 404 either — it becomes the landing page, a 200, which is the quietest of the three. Readiness is
# what makes it visible. For a *machine* path, quarkus.quinoa.ignored-path-prefixes below is what
# keeps the answer a 404 rather than HTML.

# --- the landing SPA (Quinoa) --------------------------------------------------------------------
# qits-spa-home is a git submodule at src/main/webui — Quinoa's default ui-dir, so the location is a
# convention rather than a setting. Quinoa builds it during `package` and bakes the bundle into this
# binary as build-time generated static resources; there is no second container and no nginx.
#
# ui-root-path is left at its default `/`. Every other qits service mounts its client under its own
# segment (/projects/, /ci/, …) because the gateway routes it there; the gateway HAS no segment, and
# this is the platform's landing page, so the root is the address.
#
# Pinned rather than derived. Quinoa's Angular detection can read this out of angular.json on its
# own (no `outputPath` in that file, so it falls back to dist/<project>/browser — which is exactly
# the value below), but the platform convention is to spell a value where its failure would land: a
# wrong pin fails loudly with "Quinoa build directory not found", a silent derivation drift does
# not.
quarkus.quinoa.build-dir=dist/qits-spa-home/browser

# `npm ci` rather than `npm install`, always — not only when the CI environment variable happens to
# be set. src/main/webui is a SUBMODULE: a build of this repository has no business rewriting
# another repository's package-lock.json, and a lockfile that no longer matches its package.json
# must stop this build rather than be quietly repaired inside a checkout nobody is going to commit.
#
# This holds for a developer's `./mvnw package` too, and it is the reason nothing else about npm is
# configured here. `npm ci` installs from the lockfile alone, and qits-spa-home's lockfile pins a
# full resolved URL per package — http://localhost:8081/…, the platform registry as a developer on
# the host reaches it. So on a workstation the committed lockfile already names a reachable address
# and the host's npm needs no registry flag, no .npmrc from this repo and no proxy setting: the
# URLs carry everything. The pipeline step is where that stops being true (the same registry is
# qits-artifacts:8080 inside the qits-net container), which is why the ORIGIN swap lives in
# .config/qits/ci-post-receive.yml and not in a key here — it is a property of where the build runs,
# and this file is read everywhere.
#
# The cost `ci=true` carries is that npm deletes and refetches node_modules on every run rather than
# reusing an installed tree, so a repeated local `package` pays the install again. Quinoa reruns it
# per build either way; if that becomes the slow part of an inner loop, `quarkus:dev` (which runs
# the Angular dev server) is the loop to use, not a looser install mode.
quarkus.quinoa.ci=true

# Client-side routes survive a reload: a GET that matches no ignored prefix below is re-routed to
# index.html instead of 404ing, so /whatever/the/router/owns works when it is typed rather than
# navigated to. Quinoa installs that handler at route order 40_000 — BEHIND GatewayRouter's route at
# 20_000, which is what makes the route table, not a list, decide who answers first.
quarkus.quinoa.enable-spa-routing=true

# THE PRECEDENCE RULE IS ROUTE ORDER, NOT THIS LIST — and that is the point of the arrangement.
# GatewayRouter registers at RouteConstants.ROUTE_ORDER_AFTER_DEFAULT (20_000), which lands between
# two Quinoa/Quarkus handlers (both orders read off the jars, see GatewayRouter.ROUTE_ORDER):
#
#   1060    the SPA's static assets   (Quarkus GeneratedStaticResourcesProcessor; `/` lands here)
#   20000   the proxy                 (GatewayRouter — route table matches ⇒ proxied, else next())
#   40000   the SPA deep-link fallback (Quinoa QUINOA_SPA_ROUTE_ORDER ⇒ index.html)
#
# So a proxied segment beats the landing page because the ROUTE TABLE claims it, and a path no
# service claims falls through to the SPA. Add a service to QitsService, give it a proxy-hosts
# entry, and it is routed — there is no second place to register it and nothing here to keep in
# step. This list used to carry every platform segment for exactly that reason (the SPA fallback ran
# FIRST, so /artifacts, /v2, /ci … each had to be named to hold it off) and a segment missing from
# it was answered with 200 text/html instead of being proxied. That failure mode is gone.
#
# What remains is the gateway's OWN machine surface — the same /api,/q every other qits service
# lists, and for the same reason: these paths are served (or 404ed) by this process, never proxied,
# so the route table has no say over them and something must still stop the SPA from answering a
# mistyped one with a web page. /api carries ConfigJsonRoute and AuthMeRoute; /q is
# quarkus.http.non-application-root-path.
#
# /main-navigation is the third, and it is DEFENCE IN DEPTH rather than the thing that makes the
# route work: NavigationRoute registers at order 100 and already wins the exact path. What this adds
# is the near miss — /main-navigation/ or /main-navigations, which no route claims. Without the
# prefix, the SPA fallback answers those with 200 text/html, and a machine client parsing JSON reads
# a web page as a malformed document instead of a 404 it can act on. It has no segment for the same
# reason /api/config.json has none: the gateway has none.
#
# Two traps, both real (docs/project-setup-quinoa-angular.md in the qits monorepo):
#   * setting this key REPLACES Quinoa's derivation instead of extending it, which is why /q is
#     spelled here by hand even though Quinoa would have derived it from
#     quarkus.http.non-application-root-path;
#   * values are matched AFTER ui-root-path is stripped. Here ui-root-path is `/`, so the two
#     spellings coincide — do not copy that assumption into a service that mounts under a segment.
quarkus.quinoa.ignored-path-prefixes=/api,/q,/main-navigation

# NO DOCKER AND NO NETWORK, unchanged. Quinoa disables itself in test mode by default; this says so
# out loud rather than relying on it, because the suite's whole discipline is that it runs from a
# clone with nothing installed — no node, and not even the submodule checked out.
%test.quarkus.quinoa=false

# --- edge headers -------------------------------------------------------------------------------
# X-Qits-* is the gateway's reserved namespace — everything it asserts about a request lives there,
# and EdgeHeaders strips that prefix from every inbound request unconditionally. That rule is in
# code, not here: it must not be shrinkable by configuration.
#
# The key below is the separate COMPATIBILITY list, for the header names a forward-auth proxy uses
# when one still fronts the gateway. Defaults cover the Authelia and oauth2-proxy names; the list is
# additive per deployment — never shrink it below what that proxy injects.
# qits.gateway.forwarded.strip-request-headers=Remote-User,Remote-Groups,...
#
# `enabled` maintains the X-Forwarded-* set on the way upstream. Ordinary multi-hop semantics:
# X-Forwarded-For is APPENDED to and -Host/-Proto/-Port are set only when absent, because
# qits-platform-edge binds the host port and this gateway is no longer the outermost hop. Reaching
# the gateway directly is still supported and behaves as it always did — with no inbound value,
# "append" is "set". See the README's security posture for the first-entry rule.
# qits.gateway.forwarded.enabled=true

# --- authentication ------------------------------------------------------------------------------
# The auth target, fixed at BUILD time. `-Dqits.variant=…` is a system property, so it is read by
# SmallRye Config during augmentation and baked into the recorded bean set by the @IfBuildProperty
# guards in security/. That is the point: once the build has run, NO environment variable and NO
# properties file can add the open `local` mechanism back to a gateway built as `oauth`. Setting
# QITS_AUTH_VARIANT at runtime changes nothing at all.
#
#   -Dqits.variant=oauth   OIDC login terminated here; needs QUARKUS_OIDC_* at runtime
#   -Dqits.variant=local   EXPLICITLY UNAUTHENTICATED — a fixed local user. Never internet-expose.
#
# Flagless `quarkus:dev` and `test` default to oauth; packaging without the flag is refused by the
# require-auth-variant enforcer rule, so a shipped artifact always named its target.
qits.auth.variant=${qits.variant:oauth}

# The only authorization decision in the system, made here and nowhere else — no groups header is
# emitted downstream, so no service can make (or appear to make) a role decision of its own. Unset
# means "any authenticated user".
# qits.auth.required-role=qits-user

# The `local` target's fixed identity. Inert in an oauth build — the mechanism that reads them does
# not exist there. Empty groups reads as absent for the Optional config property.
qits.auth.local.user=local
qits.auth.local.groups=

# --- OIDC (the oauth target) ----------------------------------------------------------------------
# Deployment values are env-provided and REQUIRED at runtime: QUARKUS_OIDC_AUTH_SERVER_URL,
# QUARKUS_OIDC_CLIENT_ID, QUARKUS_OIDC_CREDENTIALS_SECRET.
#
# hybrid: browsers get the code flow terminated here plus the encrypted q_session cookie — which is
# what lets the header-less transports (EventSource SSE, WebSocket upgrades) ride along through the
# proxy; requests with an Authorization: Bearer JWT are validated resource-server style instead.
quarkus.oidc.application-type=hybrid
# Non-navigation requests get 499 + WWW-Authenticate: OIDC instead of a 302 they cannot follow.
# Which requests count is decided by NonNavigationRequestChecker — only real navigations enter the
# code flow, so background transports cannot clobber the q_auth state cookie mid-login. This matters
# more here than it did in the monolith: every SSE channel and every websocket in the deployment now
# passes through this one process.
quarkus.oidc.authentication.java-script-auto-redirect=false
# Silently refresh an expired access token, and let the cookie outlive the ID token long enough for
# that refresh to have something to ride on.
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.authentication.session-age-extension=30M
# Keycloak puts realm_access in the ACCESS token; code-flow roles default to the ID token.
quarkus.oidc.roles.source=accesstoken
# The principal is the NAME, not the subject id: it is what upstreams write into their audit columns
# and the platform's existing rows hold usernames. The id travels separately as X-Qits-User-Id.
quarkus.oidc.token.principal-claim=preferred_username
# RP-initiated logout. No handler — the OIDC mechanism intercepts this path itself.
quarkus.oidc.logout.path=/api/auth/logout
quarkus.oidc.logout.post-logout-path=/

quarkus.log.level=INFO
quarkus.log.category."eu.wohlben.qits.gateway".level=INFO
quarkus.banner.enabled=false

# Name the compiled artifact `qits-gateway` (not qits-gateway-<version>-runner), so `-Dnative`
# produces target/qits-gateway directly — the same convention as qits' workspace-daemon, and an
# identifiable process name in `ps`/`docker top`.
#
# The name is spelled TWICE: here, and as the failsafe plugin's native.image.path in pom.xml. They
# have to move together — with an output-name set, the ${finalName}-runner path failsafe defaults to
# does not exist, so a native @QuarkusIntegrationTest launches nothing and passes anyway. Change one
# of the two and the other is now wrong.
quarkus.package.output-name=qits-gateway
quarkus.package.jar.add-runner-suffix=false

# In dev mode the fronted services are local processes on distinct ports, not containers on
# qits-net where every one of them answers on 8080. Override the hosts you actually run, e.g.
# %dev.qits.gateway.proxy-hosts.projects=localhost:8090 — or keep it out of this tracked file and
# put it in .env, which is the per-machine mechanism the services use.
%dev.quarkus.http.port=8000

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path, the same
# shape as qits.projects.url in qits-workspaces. The ingest path is qits-observability's own and
# belongs to the service, not to the deployment, so it is spelled once here and derived rather than
# configured. Point this at a collector or a different host and everything below follows.
qits.observability.url=http://qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base — so this resolves to the three ingest routes at
# /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# qits-events' OtelLogBridgeTest proves this arrangement end to end against a decoded
# ExportLogsServiceRequest, and its PackagedLogBridgeIT repeats it against the packaged artifact.
# That proof is the platform's, not one per repository: the extension and the config machinery are
# identical here. What this repo keeps is OtelLogConfigTest, which pins these four values and the
# exporter's endpoint so drift cannot disable log export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
