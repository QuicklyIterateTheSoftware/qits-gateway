# qits-gateway — the qits front door (docs/epics/qits-gateway/epic.md in the qits monorepo).
# A stateless reverse proxy: it holds a route table and streams bytes. No datasource, no ORM, no
# REST layer — see README.md for the routing model.

# The single published listener of a qits deployment. Bind on all interfaces: the process runs in a
# container and is reached from outside it.
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Bodies stream through the proxy, but the server still enforces this ceiling on the way in. It has
# to be at least as large as the biggest upload any fronted component accepts (artifact blobs are
# the driver), otherwise the gateway rejects what the upstream would have taken.
quarkus.http.limits.max-body-size=100M

# Long-lived exchanges pass through here: SSE event channels, `git clone` of a big repository, and
# dev-server HMR websockets. The default 60s read timeout would sever them.
quarkus.http.idle-timeout=1H

# The gateway's own surface, never proxied (GatewayRouter skips this prefix explicitly):
#   /q/health/live   — the process is up
#   /q/health/ready  — a non-empty route table, with the table itself as health data
# This is the GATEWAY's /q, not a service's. Each service now serves its own under its segment
# (/observability/q/openapi and so on), which the gateway proxies like any other path — and which is
# NOT on the token-free allowlist, because nothing that must reach it comes through here.
quarkus.http.non-application-root-path=/q

# --- the web components' identity relay ----------------------------------------------------------
# GET /api/config.json is served by this process (ConfigJsonRoute), not proxied: it is web-component
# configuration, and the gateway is what serves the web components. The path is fixed by its caller
# — @qits/angular fetches the base-relative `api/config.json` before the app bootstraps — and takes
# no segment prefix, because the gateway has none.
#
# The values are injected by the deployment, under the same names a supervising qits already uses,
# and relayed verbatim; nothing is defaulted here. Absent OTEL endpoint ⇒ SPA telemetry stays dark;
# absent capture endpoint ⇒ no capture button. The two gate independently.
#   OTEL_EXPORTER_OTLP_ENDPOINT   gate for the `telemetry` section (the URL itself is not relayed)
#   OTEL_SERVICE_NAME             relayed as telemetry.serviceName (defaults to `webapp`)
#   OTEL_RESOURCE_ATTRIBUTES      the k=v,k=v list, parsed into both sections' resourceAttributes
#   QITS_CAPTURE_ENDPOINT         relayed verbatim as capture.ingestUrl

# --- the main qits app (the catch-all) ----------------------------------------------------------
# Everything no service below claims falls through to the qits monolith, addressed by its `qits-net`
# DNS name. Verbatim passthrough, so qits sees exactly the paths it does today — /api, /mcp, /git,
# /service, the SPA. Unset app-host ⇒ no catch-all (unclaimed paths 404 at the gateway).
#   QITS_GATEWAY_APP_HOST=qits   QITS_GATEWAY_APP_PORT=8080
#
# This key is also what keeps PublicPaths.onTheMonolith alive: the monolith-relative token-free
# paths (/git/, /api/otel/, /mcp/, …) are the addresses THIS upstream serves. Unsetting app-host is
# the trigger to delete that method and its half of PublicPathsTest.
qits.gateway.app-host=qits
qits.gateway.app-port=8080

# --- split-out services (the QitsService registry) ----------------------------------------------
# A service is routed only when its host is named here; the entry is both the on-switch and the
# target. The key is the public segment — the qits- prefix is NOT exposed, so qits-artifacts is
# reached at /artifacts/*. The value is `host` or `host:port` (default port 8080). Forwarding is
# verbatim: the upstream sees /artifacts/… unchanged.
#   QITS_GATEWAY_PROXY_HOSTS_ARTIFACTS=qits-artifacts
#
# All known services are listed below, commented: these are still placeholder submodules, so
# enabling one before its container exists would 502. Uncomment a line as each service goes live —
# nothing changes for callers, it is the same origin with a new upstream.
# qits.gateway.proxy-hosts.artifacts=qits-artifacts
# qits.gateway.proxy-hosts.observability=qits-observability
# qits.gateway.proxy-hosts.workspaces=qits-workspaces
# qits.gateway.proxy-hosts.projects=qits-projects
# qits.gateway.proxy-hosts.stt=qits-stt
# qits.gateway.proxy-hosts.ci=qits-ci
# qits.gateway.proxy-hosts.cd=qits-cd

# --- edge headers -------------------------------------------------------------------------------
# X-Qits-* is the gateway's reserved namespace — everything it asserts about a request lives there,
# and EdgeHeaders strips that prefix from every inbound request unconditionally. That rule is in
# code, not here: it must not be shrinkable by configuration.
#
# The key below is the separate COMPATIBILITY list, for the header names a forward-auth proxy uses
# when one still fronts the gateway. Defaults cover the Authelia and oauth2-proxy names; the list is
# additive per deployment — never shrink it below what that proxy injects.
# qits.gateway.forwarded.strip-request-headers=Remote-User,Remote-Groups,...
# qits.gateway.forwarded.enabled=true

# --- authentication ------------------------------------------------------------------------------
# The auth target, fixed at BUILD time. `-Dqits.variant=…` is a system property, so it is read by
# SmallRye Config during augmentation and baked into the recorded bean set by the @IfBuildProperty
# guards in security/. That is the point: once the build has run, NO environment variable and NO
# properties file can add the open `local` mechanism back to a gateway built as `oauth`. Setting
# QITS_AUTH_VARIANT at runtime changes nothing at all.
#
#   -Dqits.variant=oauth   OIDC login terminated here; needs QUARKUS_OIDC_* at runtime
#   -Dqits.variant=local   EXPLICITLY UNAUTHENTICATED — a fixed local user. Never internet-expose.
#
# Flagless `quarkus:dev` and `test` default to oauth; packaging without the flag is refused by the
# require-auth-variant enforcer rule, so a shipped artifact always named its target.
qits.auth.variant=${qits.variant:oauth}

# The only authorization decision in the system, made here and nowhere else — no groups header is
# emitted downstream, so no service can make (or appear to make) a role decision of its own. Unset
# means "any authenticated user".
# qits.auth.required-role=qits-user

# The `local` target's fixed identity. Inert in an oauth build — the mechanism that reads them does
# not exist there. Empty groups reads as absent for the Optional config property.
qits.auth.local.user=local
qits.auth.local.groups=

# --- OIDC (the oauth target) ----------------------------------------------------------------------
# Deployment values are env-provided and REQUIRED at runtime: QUARKUS_OIDC_AUTH_SERVER_URL,
# QUARKUS_OIDC_CLIENT_ID, QUARKUS_OIDC_CREDENTIALS_SECRET.
#
# hybrid: browsers get the code flow terminated here plus the encrypted q_session cookie — which is
# what lets the header-less transports (EventSource SSE, WebSocket upgrades) ride along through the
# proxy; requests with an Authorization: Bearer JWT are validated resource-server style instead.
quarkus.oidc.application-type=hybrid
# Non-navigation requests get 499 + WWW-Authenticate: OIDC instead of a 302 they cannot follow.
# Which requests count is decided by NonNavigationRequestChecker — only real navigations enter the
# code flow, so background transports cannot clobber the q_auth state cookie mid-login. This matters
# more here than it did in the monolith: every SSE channel and every websocket in the deployment now
# passes through this one process.
quarkus.oidc.authentication.java-script-auto-redirect=false
# Silently refresh an expired access token, and let the cookie outlive the ID token long enough for
# that refresh to have something to ride on.
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.authentication.session-age-extension=30M
# Keycloak puts realm_access in the ACCESS token; code-flow roles default to the ID token.
quarkus.oidc.roles.source=accesstoken
# The principal is the NAME, not the subject id: it is what upstreams write into their audit columns
# and the platform's existing rows hold usernames. The id travels separately as X-Qits-User-Id.
quarkus.oidc.token.principal-claim=preferred_username
# RP-initiated logout. No handler — the OIDC mechanism intercepts this path itself.
quarkus.oidc.logout.path=/api/auth/logout
quarkus.oidc.logout.post-logout-path=/

quarkus.log.level=INFO
quarkus.log.category."eu.wohlben.qits.gateway".level=INFO
quarkus.banner.enabled=false

# Name the compiled artifact `qits-gateway` (not qits-gateway-<version>-runner), so `-Dnative`
# produces target/qits-gateway directly — the same convention as qits' workspace-daemon, and an
# identifiable process name in `ps`/`docker top`.
#
# The name is spelled TWICE: here, and as the failsafe plugin's native.image.path in pom.xml. They
# have to move together — with an output-name set, the ${finalName}-runner path failsafe defaults to
# does not exist, so a native @QuarkusIntegrationTest launches nothing and passes anyway. Change one
# of the two and the other is now wrong.
quarkus.package.output-name=qits-gateway
quarkus.package.jar.add-runner-suffix=false

# In dev mode the fronted qits is normally a local process, not a container on qits-net.
%dev.qits.gateway.app-host=localhost
%dev.quarkus.http.port=8000
