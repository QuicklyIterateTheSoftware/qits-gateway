# qits-gateway — the qits front door (docs/epics/qits-gateway/epic.md in the qits monorepo).
# A stateless reverse proxy: it holds a route table and streams bytes. No datasource, no ORM, no
# REST layer — see README.md for the routing model.

# The single published listener of a qits deployment. Bind on all interfaces: the process runs in a
# container and is reached from outside it.
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Bodies stream through the proxy, but the server still enforces this ceiling on the way in. It has
# to be at least as large as the biggest upload any fronted component accepts (artifact blobs are
# the driver), otherwise the gateway rejects what the upstream would have taken.
quarkus.http.limits.max-body-size=100M

# Long-lived exchanges pass through here: SSE event channels, `git clone` of a big repository, and
# dev-server HMR websockets. The default 60s read timeout would sever them.
quarkus.http.idle-timeout=1H

# The gateway's own surface, never proxied (GatewayRouter skips this prefix explicitly):
#   /q/health/live   — the process is up
#   /q/health/ready  — a non-empty route table, with the table itself as health data
quarkus.http.non-application-root-path=/q

# --- the main qits app (the catch-all) ----------------------------------------------------------
# Everything no service below claims falls through to the qits monolith, addressed by its `qits-net`
# DNS name. Verbatim passthrough, so qits sees exactly the paths it does today — /api, /mcp, /git,
# /service, the SPA. Unset app-host ⇒ no catch-all (unclaimed paths 404 at the gateway).
#   QITS_GATEWAY_APP_HOST=qits   QITS_GATEWAY_APP_PORT=8080
qits.gateway.app-host=qits
qits.gateway.app-port=8080

# --- split-out services (the QitsService registry) ----------------------------------------------
# A service is routed only when its host is named here; the entry is both the on-switch and the
# target. The key is the public segment — the qits- prefix is NOT exposed, so qits-artifacts is
# reached at /artifacts/*. The value is `host` or `host:port` (default port 8080). Forwarding is
# verbatim: the upstream sees /artifacts/… unchanged.
#   QITS_GATEWAY_PROXY_HOSTS_ARTIFACTS=qits-artifacts
#
# All known services are listed below, commented: these are still placeholder submodules, so
# enabling one before its container exists would 502. Uncomment a line as each service goes live —
# nothing changes for callers, it is the same origin with a new upstream.
# qits.gateway.proxy-hosts.artifacts=qits-artifacts
# qits.gateway.proxy-hosts.observability=qits-observability
# qits.gateway.proxy-hosts.workspaces=qits-workspaces
# qits.gateway.proxy-hosts.projects=qits-projects
# qits.gateway.proxy-hosts.stt=qits-stt
# qits.gateway.proxy-hosts.ci=qits-ci
# qits.gateway.proxy-hosts.cd=qits-cd

# --- edge headers -------------------------------------------------------------------------------
# Identity headers dropped from every inbound request before forwarding. This is the gateway's half
# of the forward-auth trust contract (qits' forwardauth variant believes these unconditionally).
# Defaults cover the Authelia and oauth2-proxy names; the list is additive per deployment — never
# shrink it below what the fronted qits build trusts.
# qits.gateway.forwarded.strip-request-headers=Remote-User,Remote-Groups,...
# qits.gateway.forwarded.enabled=true

quarkus.log.level=INFO
quarkus.log.category."eu.wohlben.qits.gateway".level=INFO
quarkus.banner.enabled=false

# Name the compiled artifact `qits-gateway` (not qits-gateway-<version>-runner), so `-Dnative`
# produces target/qits-gateway directly — the same convention as qits' workspace-daemon, and an
# identifiable process name in `ps`/`docker top`.
quarkus.package.output-name=qits-gateway
quarkus.package.jar.add-runner-suffix=false

# In dev mode the fronted qits is normally a local process, not a container on qits-net.
%dev.qits.gateway.app-host=localhost
%dev.quarkus.http.port=8000
